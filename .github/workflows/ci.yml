name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Fast tests (mocked model, schema validation, features)
        run: pytest -m "not slow"

      - name: Integration tests (real serialized models, 10k-beat batch)
        run: pytest -m slow

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build backend and frontend images
        run: docker compose build
